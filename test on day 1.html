<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Inside a Box</title>
    <style>
        /* Centers the outer box on the screen */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }

        /* Styling for the big outer box */
        .outer-box {
            width: 400px;
            height: 300px;
            background-color: blue; /* Blue */
            border: 4px solid #2980b9;
            
            /* Centers the inner box inside the outer box */
            display: flex;
            justify-content: space-evenly;
            align-items:flex-start;
            border-radius:10%;
            
        }

        /* Styling for the small inner box */
        .inner-box {
            width: 50px;
            height: 50px;
            margin:20px;
            background-color:green; O
            border: black;
            border-radius:20%;
            text-align:center;
        }
        .inner-box2{
          width: 50px;
            height: 50px;
            margin:20px;
            background-color: pink;
            border-radius:10%;
            text-align:center;
            
        }
        .inner-box3{
            width: 50px;
            height: 50px;
            margin:20px;
            background-color:red;
            border-radius:10%;
            text-align:center;
        }
    </style>
</head>
<body>

    <!-- Outer Box -->
    <div class="outer-box">
        <!-- Inner Box -->
        <div class="inner-box">A</div>
        <div class="inner-box2">B</div>
        <div class="inner-box3">C</div>
    </div>

</body>
</html>
